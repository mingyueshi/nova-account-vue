name: Nuxt tarball consumers
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  nuxt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        nuxt: [nuxt3, nuxt4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/nuxt/${{ matrix.nuxt }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run verify:nuxt -- ${{ matrix.nuxt }}
